<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOPGANCE — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🥛</span>
      <div class="company-name">COOPGANCE S.A.</div>
      <div class="company-sub">Sistema Integral de Producción</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">❌ {{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="text" name="usuario" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">
        Ingresar al sistema →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:11px;color:#a0aeaa">
      Universidad Mariano Gálvez de Guatemala<br>
      Sede Zacapa · Sistemas de Información Gerencial · 2025
    </p>
  </div>
</body>
</html>
